spring:
  application:
    name: kitchensink
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/kitchensink}
      # IMPORTANT: Keep false. Indexes are managed via Mongock migrations.
      # Enabling this will cause 'IndexOptionsConflict' during startup.
      auto-index-creation: false

mongock:
  migration-scan-package:
    - com.example.kitchensink.migrations

server:
  port: 8080
  servlet:
    context-path: /kitchensink

management:
  endpoints:
    web:
      exposure:
        include: health,info
